<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Snackfax</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400&display=swap" rel="stylesheet">
<style>
:root{
  --red:#E8202A; --black:#0B0B0C; --ink:#121317; --ink-2:#4A4F59; --ink-3:#868C99;
  --line:#E3E5E9; --line-2:#1F2127; --bg:#fff; --soft:#F7F8FA;
  --gold:#A8801A; --gold-bg:#FDF6E3; --green:#127A4B; --blue:#17569B;
  --serif:"Source Serif 4",Georgia,"Times New Roman",serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,sans-serif;
  --disp:"Anton",Impact,"Haettenschweiler",sans-serif;
  --max:1240px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:var(--sans);font-size:15px;line-height:1.55;color:var(--ink);background:#fff}
img{display:block;max-width:100%}
button,input{font:inherit}
button{cursor:pointer;border:0;background:none;color:inherit;text-align:left}
.wrap{max-width:var(--max);margin:0 auto;padding:0 24px}
.narrow{max-width:760px;margin:0 auto}

/* ---------- prototype bar ---------- */
.proto{position:sticky;top:0;z-index:400;background:#15171D;color:#fff;display:flex;gap:10px;align-items:center;padding:8px 16px;font-size:12.5px;flex-wrap:wrap}
.proto b{letter-spacing:.06em;text-transform:uppercase;font-size:11px;color:#8b93a4}
.proto .seg{display:flex;background:#23262F;border-radius:999px;padding:3px}
.proto .seg button{padding:5px 12px;border-radius:999px;color:#b8bfcc}
.proto .seg button.on{background:#fff;color:#111}
.proto .v1{margin-left:auto;color:#7f8798;text-decoration:underline}

/* ---------- ADWEEK-STYLE MASTHEAD ---------- */
.mast{background:#fff;color:var(--ink);position:sticky;top:33px;z-index:300;border-bottom:1px solid var(--line)}
.mast .bar{display:flex;align-items:center;gap:28px;padding:14px 0 12px}
.brand{font-family:var(--disp);font-size:44px;line-height:.82;letter-spacing:.005em;color:var(--red);transform:scaleX(1.06);transform-origin:left;white-space:nowrap}
.brand small{display:block;font-family:var(--sans);font-size:7.5px;letter-spacing:.34em;font-weight:700;color:var(--ink);transform:scaleX(.95);transform-origin:left;margin-top:5px}
.teaser{display:flex;align-items:center;gap:10px;border:1px solid var(--red);border-radius:3px;padding:9px 14px;max-width:440px;font-size:13.5px;color:var(--ink-2)}
.teaser b{color:var(--red);font-weight:800;letter-spacing:.06em;font-size:11.5px;text-transform:uppercase;white-space:nowrap}
.teaser:hover{background:#FDEEEF}
.mast .acts{margin-left:auto;display:flex;align-items:center;gap:20px;font-size:13.5px;white-space:nowrap}
.mast .acts .subs{font-weight:700}
.mast .acts .who{color:var(--ink-2)}
.mast .acts .ic{font-size:16px}
nav.rail{display:flex;justify-content:center;gap:30px;padding:2px 0 14px;border-top:1px solid var(--line);margin-top:6px;padding-top:12px;font-size:12.5px;font-weight:800;letter-spacing:.13em;text-transform:uppercase;flex-wrap:wrap}
nav.rail button{color:var(--ink-2);padding-bottom:3px;border-bottom:2px solid transparent}
nav.rail button:hover{color:var(--red)}
nav.rail button.on{color:var(--red);border-color:var(--red)}
nav.rail button .free{display:inline-block;background:var(--red);color:#fff;font-size:9px;letter-spacing:.08em;padding:2px 5px;border-radius:2px;margin-left:5px;vertical-align:1px}

/* ad slot */
.adslot{background:var(--soft);border-top:1px solid var(--line);border-bottom:1px solid var(--line);text-align:center;padding:12px 0}
.adslot .box{max-width:728px;height:90px;margin:0 auto;background:#fff;border:1px dashed #CFD4DC;color:var(--ink-3);display:grid;place-items:center;font-weight:800;letter-spacing:.04em;border-radius:3px}
.adslot .lb{font-size:9.5px;letter-spacing:.22em;color:var(--ink-3);text-transform:uppercase;margin-bottom:6px}

/* ---------- editorial primitives (Modern Retail) ---------- */
.kick{font-size:11px;font-weight:800;letter-spacing:.11em;text-transform:uppercase;color:var(--red);display:inline-flex;align-items:center;gap:7px}
.kick.b{color:var(--blue)}.kick.g{color:var(--green)}.kick.k{color:var(--ink-2)}
.hl{font-family:var(--serif);font-weight:700;letter-spacing:-.012em;line-height:1.14;margin:8px 0 8px}
.dt{font-size:12.5px;color:var(--ink-3);margin:0 0 9px}
.dek{font-family:var(--serif);font-size:16px;line-height:1.55;color:var(--ink-2);margin:0}
.lock{display:inline-flex;align-items:center;gap:5px;background:var(--gold-bg);color:var(--gold);border:1px solid #EDDCAE;font-size:9.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;padding:3px 7px;border-radius:2px}
.freebadge{display:inline-flex;align-items:center;gap:5px;background:#EAF6EF;color:var(--green);border:1px solid #C6E5D4;font-size:9.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;padding:3px 7px;border-radius:2px}
.rule{border-top:1px solid var(--line);margin:0}
.sechead{display:flex;align-items:flex-end;gap:14px;border-bottom:2px solid var(--red);padding-bottom:8px;margin:44px 0 22px}
.sechead h2{font-family:var(--disp);font-size:30px;letter-spacing:.01em;text-transform:uppercase;margin:0;line-height:1}
.sechead .vm{margin-left:auto;font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2)}
.sechead .vm:hover{color:var(--red)}

/* lead block */
.lead{display:grid;grid-template-columns:260px 1fr;gap:38px;padding:30px 0 34px}
.lead .rail-l{border-right:1px solid var(--line);padding-right:28px}
.nl-box h4{font-family:var(--serif);font-size:21px;line-height:1.2;margin:0 0 8px}
.nl-box p{font-size:13.5px;color:var(--ink-2);margin:0 0 12px}
.nl-box form{display:flex;flex-direction:column;gap:8px}
.nl-box input{border:1px solid var(--line);padding:9px 11px;font-size:13.5px;border-radius:2px;outline:0}
.nl-box button{background:var(--red);color:#fff;font-weight:800;letter-spacing:.1em;font-size:11.5px;text-transform:uppercase;padding:11px;border-radius:2px;text-align:center}
.rail-sec{margin-top:30px;border-top:1px solid var(--line);padding-top:16px}
.rail-sec h5{font-family:var(--disp);font-size:18px;text-transform:uppercase;margin:0 0 12px;letter-spacing:.02em}
.rail-item{display:block;width:100%;padding:12px 0;border-bottom:1px solid var(--line)}
.rail-item h6{font-family:var(--serif);font-size:15px;line-height:1.28;margin:6px 0 4px;font-weight:600}
.rail-item:hover h6{color:var(--red)}
.leadmain .ph{width:100%;aspect-ratio:16/9;background:var(--img) center/cover;background-color:#E6E8EC;margin-bottom:16px}
.leadmain h1.hl{font-size:40px}
.leadmain .dek{font-size:17.5px}

/* briefs */
.briefs{background:var(--soft);border-top:3px solid var(--red);padding:22px 26px 6px;margin:8px 0 0}
.briefs h3{font-family:var(--disp);font-size:22px;text-transform:uppercase;margin:0 0 4px}
.briefs .sb{font-family:var(--serif);font-size:17px;font-weight:700;margin:0 0 14px}
.briefs ul{margin:0;padding:0;list-style:none}
.briefs li{border-top:1px solid var(--line);padding:12px 0;font-family:var(--serif);font-size:15.5px;line-height:1.5;color:var(--ink-2)}
.briefs li u{text-decoration-color:var(--red);text-underline-offset:3px;color:var(--ink);cursor:pointer}
.briefs li u:hover{color:var(--red)}

/* top stories date stamp */
.ts-grid{display:grid;grid-template-columns:270px 1fr;gap:38px;align-items:start}
.stamp{font-family:var(--disp);font-size:58px;line-height:.86;text-transform:uppercase;letter-spacing:.005em}
.stamp span{display:block;color:#C9CDD5}
.ts-list .row{display:grid;grid-template-columns:1fr 210px;gap:26px;padding:24px 0;border-bottom:1px solid var(--line);width:100%;text-align:left;align-items:start}
.ts-list .row:first-child{padding-top:0}
.ts-list .row .th{aspect-ratio:4/3;background:var(--img) center/cover;background-color:#E6E8EC}
.ts-list .row h3.hl{font-size:23px;margin-top:9px}
.ts-list .row:hover h3.hl{color:var(--red)}

/* card grids */
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:30px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:24px}
.c{width:100%;text-align:left;display:flex;flex-direction:column}
.c .ph{aspect-ratio:16/10;background:var(--img) center/cover;background-color:#E6E8EC;margin-bottom:13px}
.c h3.hl{font-size:19px;margin-top:8px}
.c:hover h3.hl{color:var(--red)}
.c .dek{font-size:14.5px}

/* shorts strip */
.shorts-strip{background:var(--red);color:#fff;padding:30px 0 34px;margin-top:46px}
.shorts-strip .sechead{border-color:#fff;margin-top:0}
.shorts-strip .sechead h2{color:#fff}
.shorts-strip .sechead .vm{color:#FFD9DB}
.reel{display:flex;gap:16px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:8px;scrollbar-width:none}
.reel::-webkit-scrollbar{display:none}
.sh{flex:none;width:186px;scroll-snap-align:start;text-align:left}
.sh .ph{width:186px;height:322px;background:linear-gradient(180deg,rgba(0,0,0,.05),rgba(0,0,0,.75)),var(--img) center/cover;background-color:#22242A;position:relative;display:flex;align-items:flex-end;padding:12px}
.sh .ph .d{position:absolute;top:10px;right:10px;background:rgba(0,0,0,.6);font-size:11px;font-weight:700;padding:2px 7px}
.sh .ph .lv{position:absolute;top:10px;left:10px;background:var(--red);font-size:9.5px;font-weight:800;padding:3px 7px;letter-spacing:.06em}
.sh h4{font-family:var(--serif);font-size:15px;line-height:1.28;margin:0;color:#fff}
.sh .v{font-size:12px;color:#FFD9DB;margin-top:6px}

/* ---------- ADWEEK-STYLE CATEGORY PAGE ---------- */
.cat-hero{background:var(--red);color:#fff;text-align:center;padding:46px 0 42px}
.cat-hero h1{font-family:var(--disp);font-size:58px;letter-spacing:.06em;text-transform:uppercase;margin:0 0 14px;line-height:1}
.cat-hero p{max-width:620px;margin:0 auto;font-size:15px;color:#FFD9DB}
.cat-latest{font-family:var(--disp);font-size:34px;text-transform:uppercase;letter-spacing:.02em;margin:34px 0 0;position:relative;display:inline-block}
.cat-latest:after{content:"";display:block;height:5px;background:var(--red);margin-top:6px}
.catrow{display:grid;grid-template-columns:1fr 250px;gap:30px;padding:26px 0;border-bottom:1px solid var(--line);width:100%;text-align:left;align-items:start}
.catrow h3{font-family:var(--serif);font-size:25px;line-height:1.16;letter-spacing:-.012em;margin:0 0 10px;font-weight:700}
.catrow:hover h3{color:var(--red)}
.catrow .by{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2)}
.catrow .by em{font-style:normal;color:var(--ink-3);font-weight:700}
.catrow .rf{font-size:11.5px;font-weight:800;letter-spacing:.11em;text-transform:uppercase;color:var(--red);margin-top:12px;display:inline-block}
.catrow .th{aspect-ratio:4/3;background:var(--img) center/cover;background-color:#E6E8EC}

/* ---------- ARTICLE + PAYWALL ---------- */
.art .kick{margin-bottom:6px}
.art h1{font-family:var(--serif);font-size:42px;line-height:1.1;letter-spacing:-.02em;margin:10px 0 14px;font-weight:700}
.art .sub{font-family:var(--serif);font-size:19px;color:var(--ink-2);margin:0 0 20px}
.byline{display:flex;align-items:center;gap:12px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:13px 0;margin-bottom:24px;font-size:13px}
.byline .av{width:38px;height:38px;border-radius:50%;background:var(--img) center/cover;background-color:#D6D9DF;flex:none}
.byline .nm{font-weight:800;letter-spacing:.06em;text-transform:uppercase;font-size:11.5px}
.byline .dd{color:var(--ink-3);font-size:12.5px}
.byline .sh2{margin-left:auto;display:flex;gap:8px}
.byline .sh2 button{border:1px solid var(--line);padding:6px 12px;font-size:12px;font-weight:700;border-radius:2px}
.art .hero{width:100%;aspect-ratio:16/9;background:var(--img) center/cover;background-color:#E6E8EC;margin-bottom:8px}
.art .cap{font-size:12px;color:var(--ink-3);margin:0 0 26px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.art p.b{font-family:var(--serif);font-size:18.5px;line-height:1.68;margin:0 0 22px}
.art h2.s2{font-family:var(--serif);font-size:25px;margin:34px 0 14px;letter-spacing:-.01em}
.kp{background:var(--soft);border-left:4px solid var(--red);padding:18px 20px;margin:0 0 26px}
.kp h4{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--red);margin:0 0 10px}
.kp ul{margin:0;padding-left:18px;font-family:var(--serif);font-size:16px;line-height:1.65;color:var(--ink-2)}
.pull{font-family:var(--serif);font-size:24px;line-height:1.35;border-left:4px solid var(--red);padding-left:20px;margin:30px 0;letter-spacing:-.01em}

/* the wall */
.fade{position:relative;height:130px;margin-top:-130px;background:linear-gradient(180deg,rgba(255,255,255,0),#fff 78%);pointer-events:none}
.wall{border:1px solid var(--line);border-top:4px solid var(--red);padding:32px;text-align:center;margin-bottom:34px;background:#fff}
.wall .lock{margin-bottom:14px}
.wall h3{font-family:var(--serif);font-size:27px;line-height:1.2;margin:0 0 10px}
.wall p{color:var(--ink-2);margin:0 auto 20px;max-width:46ch;font-size:15px}
.wall .cta{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.wall .primary{background:var(--red);color:#fff;font-weight:800;letter-spacing:.1em;text-transform:uppercase;font-size:12px;padding:14px 26px;border-radius:2px}
.wall .ghost{border:1px solid var(--ink);font-weight:800;letter-spacing:.1em;text-transform:uppercase;font-size:12px;padding:14px 26px;border-radius:2px}
.wall .inc{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:26px;border-top:1px solid var(--line);padding-top:20px;text-align:left}
.wall .inc div{font-size:13px;color:var(--ink-2)}
.wall .inc b{display:block;font-family:var(--serif);font-size:15px;color:var(--ink);margin-bottom:3px}
.wall .note{font-size:12.5px;color:var(--ink-3);margin-top:16px}

/* pricing */
.plans{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin:26px 0}
.plan{border:1px solid var(--line);padding:24px}
.plan.best{border:2px solid var(--red);position:relative}
.plan.best:before{content:"MOST POPULAR";position:absolute;top:-11px;left:24px;background:var(--red);color:#fff;font-size:10px;font-weight:800;letter-spacing:.1em;padding:3px 9px}
.plan h3{font-family:var(--disp);font-size:22px;text-transform:uppercase;margin:0 0 6px}
.plan .pr{font-family:var(--serif);font-size:34px;font-weight:700;margin:0}
.plan .pr span{font-size:14px;color:var(--ink-3);font-family:var(--sans)}
.plan ul{margin:16px 0 20px;padding-left:18px;font-size:14px;line-height:1.85;color:var(--ink-2)}
.plan button{width:100%;text-align:center;padding:12px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;font-size:11.5px;border:1px solid var(--ink)}
.plan.best button{background:var(--red);color:#fff;border-color:var(--red)}

/* shorts player page */
.sfeed{max-width:430px;margin:0 auto;height:calc(100vh - 220px);min-height:520px;overflow-y:scroll;scroll-snap-type:y mandatory;scrollbar-width:none;background:#000}
.sfeed::-webkit-scrollbar{display:none}
.sfeed .pane{height:100%;scroll-snap-align:start;position:relative;color:#fff;display:flex;flex-direction:column;justify-content:flex-end;padding:22px 78px 26px 22px;
  background:linear-gradient(180deg,rgba(0,0,0,.3),rgba(0,0,0,.02) 40%,rgba(0,0,0,.88)),var(--img) center/cover;background-color:#1A1C21}
.sfeed .pane h3{font-family:var(--serif);font-size:23px;line-height:1.2;margin:10px 0 6px}
.sfeed .pane p{margin:0;font-size:13.5px;color:#C9CDD5}
.sfeed .rail{position:absolute;right:14px;bottom:28px;display:flex;flex-direction:column;gap:20px;text-align:center;font-size:11px}
.sfeed .rail button em{display:block;font-style:normal;font-size:22px;margin-bottom:3px}
.sfeed .pr{position:absolute;top:0;left:0;right:0;height:3px;background:rgba(255,255,255,.22)}
.sfeed .pr b{display:block;height:100%;width:42%;background:var(--red)}

/* podcast player */
.player{border:1px solid var(--line);padding:20px;display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.player .art{width:92px;height:92px;background:linear-gradient(135deg,var(--red),#7A0E15);color:#fff;display:grid;place-content:center;text-align:center;font-family:var(--disp);font-size:14px;line-height:1.15;flex:none}
.player .mid{flex:1;min-width:250px}
.wave{display:flex;align-items:flex-end;gap:2px;height:36px;margin:10px 0;width:100%}
.wave b{flex:1;background:#DFE2E7}
.wave b.p{background:var(--red)}
.ctrls{display:flex;align-items:center;gap:12px;font-size:12.5px;color:var(--ink-3);flex-wrap:wrap}
.ctrls .pp{width:40px;height:40px;border-radius:50%;background:var(--red);color:#fff;display:grid;place-items:center}
.speed{border:1px solid var(--line);padding:5px 10px;font-size:12px;font-weight:700}
.chaps{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.chaps button{border:1px solid var(--line);padding:6px 11px;font-size:12px;color:var(--ink-2)}
.chaps button.on{background:var(--red);color:#fff;border-color:var(--red)}

/* misc */
.crumb{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);padding:22px 0 0}
.crumb button{color:var(--red)}
.emptybox{border:1px solid var(--line);padding:50px 24px;text-align:center}
.emptybox h2{font-family:var(--serif);font-size:26px;margin:0 0 8px}
.person{border:1px solid var(--line);padding:20px;width:100%;text-align:left}
.person .av{width:62px;height:62px;border-radius:50%;background:var(--img) center/cover;background-color:#D6D9DF;margin-bottom:12px}
.person h3{font-family:var(--serif);font-size:18px;margin:0 0 3px}
.person .role{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--red);margin-bottom:9px}
.person p{margin:0;font-size:13.5px;color:var(--ink-2)}
.ep{display:flex;gap:18px;padding:20px 0;border-bottom:1px solid var(--line);align-items:center;width:100%;text-align:left}
.ep .cv{width:78px;height:78px;background:linear-gradient(135deg,var(--red),#7A0E15);color:#fff;display:grid;place-content:center;font-family:var(--disp);font-size:12px;text-align:center;flex:none;line-height:1.2}
.ep h3{font-family:var(--serif);font-size:19px;margin:0 0 5px}
.ep p{margin:0 0 6px;font-size:14px;color:var(--ink-2)}
.ep .go{margin-left:auto;border:1px solid var(--ink);padding:9px 16px;font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;flex:none}

/* footer */
footer{background:var(--black);color:#9AA0AC;margin-top:56px;padding:44px 0 50px;font-size:13.5px}
footer .f4{display:grid;grid-template-columns:1.5fr repeat(3,1fr);gap:30px}
footer .brand{font-size:34px}
footer h5{color:#fff;margin:0 0 12px;font-size:11px;letter-spacing:.14em;text-transform:uppercase}
footer ul{margin:0;padding:0;list-style:none;line-height:2.1}
footer ul button:hover{color:#fff}
footer .legal{border-top:1px solid var(--line-2);margin-top:34px;padding-top:20px;font-size:12px;color:#6D7280}

/* modal */
.ov{position:fixed;inset:0;background:rgba(11,11,12,.62);z-index:500;display:none;align-items:flex-start;justify-content:center;padding:80px 20px;overflow-y:auto}
.ov.on{display:flex}
.modal{background:#fff;width:100%;max-width:540px;padding:28px}
.modal h3{font-family:var(--serif);font-size:25px;margin:0 0 6px}
.modal p.s{color:var(--ink-3);margin:0 0 18px;font-size:14px}
.modal input{width:100%;border:1px solid var(--line);padding:11px 13px;margin-bottom:10px;outline:0;font-size:15px}
.modal .primary{width:100%;text-align:center;background:var(--red);color:#fff;font-weight:800;letter-spacing:.1em;text-transform:uppercase;font-size:12px;padding:13px}
.sug button{display:block;width:100%;padding:11px 0;border-bottom:1px solid var(--line);font-size:15px;font-family:var(--serif)}
.sug button:hover{color:var(--red)}

/* ---------- mobile phone frame ---------- */
.stage{display:none;padding:26px 0 50px;place-items:center;background:#EDEFF2}
body.m .stage{display:grid}
body.m > .site{display:none}

<script>
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const I=n=>`img/${n}.jpg`;

/* ============================ DATA ============================ */
const NAV=[
  {id:'technology',name:'Technology'},{id:'brands',name:'Brands'},{id:'retail',name:'Retail'},
  {id:'money',name:'Money'},{id:'trends',name:'Trends'},{id:'founders',name:'Founders'},
  {id:'shorts',name:'Shorts',free:1},{id:'podcasts',name:'Podcasts'},{id:'events',name:'Events'}
];
const SECMETA={
  technology:{name:'Technology',blurb:'The systems underneath Indian food and retail — pricing engines, dark store software, demand forecasting and the AI everyone is piloting but few are running.'},
  brands:{name:'Brands',blurb:'What Indians are putting in their trolley, who is making it, and the distribution fights that decide which brand wins the shelf.'},
  retail:{name:'Retail',blurb:'Store formats, quick commerce, dark stores and the economics of getting a product into someone\'s hands in ten minutes.'},
  money:{name:'Money',blurb:'Rounds, valuations, margins and the unit economics behind them. We read the cap table, not the press release.'},
  trends:{name:'Trends',blurb:'The categories moving fastest, and an honest read on which are real and which are a queue of launches chasing one good quarter.'},
  founders:{name:'Founders',blurb:'Operators on the decisions that actually shaped the business, including the ones that did not work.'},
  policy:{name:'Policy',blurb:'FSSAI, labelling, GST and the regulation that reshapes a product long before it reaches a shelf.'},
  global:{name:'Global',blurb:'Supply chains, imports and the overseas shifts that land on an Indian menu two quarters later.'},
  events:{name:'Events',blurb:'Snackfax briefings, roundtables and the annual summit. Member rates apply.'}
};
const AUTHORS={
  ra:{id:'ra',name:'Rhea Anand',role:'Retail & quick commerce',img:I('founder'),bio:'Six years covering Indian grocery retail. Before Snackfax she tracked supply chains at a trade weekly.'},
  km:{id:'km',name:'Kabir Mehta',role:'Brands & consumer',img:I('founder2'),bio:'Writes about what Indians put in their trolley and why. Previously a category manager at an FMCG major.'},
  sn:{id:'sn',name:'Simran Nair',role:'Money & deals',img:I('salad'),bio:'Follows the cheques — rounds, valuations and the unit economics behind them.'},
  dv:{id:'dv',name:'Dev Iyer',role:'Technology',img:I('dark'),bio:'Covers the software layer: pricing engines, forecasting, and which AI pilots actually reached production.'}
};
const P=(...a)=>a;

const STORIES=[
 {id:'agentic-grocery',sec:'technology',kick:'AI STRATEGIES',t:'How Zepto, BigBasket and Swiggy are building their agentic shopping assistants',
  dek:'Three of India\'s biggest grocery platforms outlined how far they will let an assistant go. Most of the argument is about who is liable when it orders wrong.',
  img:I('dark'),date:'September 29, 2026',time:'2 min ago',read:'6 min read',au:'dv',lead:1,
  kp:['All three are piloting; none has an assistant placing unsupervised orders.','The blocker is returns liability, not model quality.','Reorder lists, not discovery, are where it works today.'],
  body:P('Every large grocery platform in India is now building some version of an agentic assistant, and every one of them has stopped at the same wall: nobody wants to own the order the machine got wrong.',
   'The demos are genuinely good. Tell it you are cooking for six on Thursday and it builds a basket. In testing, the baskets are sensible. The problem arrives at the doorstep, where a wrong substitution is not a model error, it is a refund, a rider, and a customer who now distrusts the app.',
   'So the live deployments are narrow. Reorder assistance works, because the assistant is matching against what you already bought. Discovery does not, because the platform cannot yet defend a recommendation it cannot explain.',
   'One head of product put it plainly: the assistant is allowed to fill the cart, but a human still presses buy. Until the returns maths changes, that is where this sits.',
   'Watch the substitution logic rather than the chat interface. That is the part that decides whether any of this survives contact with a Thursday evening.')},

 {id:'pricing-engine',sec:'technology',kick:'INSIDE THE STACK',t:'The pricing engine quietly running India\'s quick-commerce war',
  dek:'Prices on the three big apps now move several times a day. Almost none of it is a person.',
  img:I('aisle'),date:'September 28, 2026',time:'4 hr ago',read:'7 min read',au:'dv',
  kp:['Prices reprice multiple times daily, per dark store.','Competitor scraping is continuous and mutual.','Margin floors are set by category, not by SKU.'],
  body:P('The visible part of the price war is a ₹2 handling fee. The invisible part is a repricing system watching competitors continuously and moving prices per dark store, several times a day.',
   'Each platform scrapes the others. All of them know this. The result is a feedback loop where a cut in one catchment propagates within the hour, which is why these wars escalate faster than anyone intends.',
   'The guardrail is a margin floor set per category rather than per SKU, so a platform can go negative on onions if the basket recovers on staples.',
   'That design decision is why a price war can run for six days without anyone technically approving a loss.')},

 {id:'forecast-waste',sec:'technology',kick:'OPERATIONS',t:'Demand forecasting cut fresh waste by a third — at two companies out of nine',
  dek:'The models work. The reason most deployments fail is upstream of the model.',
  img:I('salad'),date:'September 26, 2026',time:'1 day ago',read:'5 min read',au:'dv',
  kp:['Two of nine deployments hit their waste target.','Failures trace to unreliable inbound data, not model choice.','Store-level override rights decide the outcome.'],
  body:P('Nine companies told us they deployed demand forecasting on fresh. Two hit their waste-reduction target. The gap is not the model.',
   'The failures share a pattern: inbound supply data that is entered late, manually, or not at all. A forecast fed yesterday\'s truck as though it arrived on time is confidently wrong.',
   'The second pattern is override rights. Where store managers could freely override the system, they did, roughly 40% of the time, and waste stayed flat. Where overrides required a reason code, usage dropped and the numbers moved.',
   'That is a management change wearing a technology badge.')},

 {id:'zomato-burger',sec:'brands',kick:'BRAND LAUNCH',t:'Zomato launches a burger brand across 10 cities',
  dek:'The new brand runs entirely on cloud kitchens, starting with Bengaluru, Delhi and Mumbai. The economics, not the burger, are the point.',
  img:I('burger'),date:'September 29, 2026',time:'2 min ago',read:'4 min read',au:'km',lead:1,
  kp:['10 cities at launch; Bengaluru, Delhi and Mumbai first.','Cloud-kitchen only — no storefront capex.','Lands in the ₹180–260 band, above QSR value menus.'],
  body:P('Zomato is launching a burger brand of its own, built entirely on cloud kitchens, with 10 cities in the first phase. Bengaluru, Delhi and Mumbai open this month.',
   'The economics are the point. A dine-in chain spends on rent, fit-out and staff before it sells anything. A cloud kitchen riding on capacity the company already leases spends almost none of that, and the delivery rails are already owned.',
   'Three people familiar with the plan say the brand will sit in the ₹180–260 band — above the QSR value menus, below the imported-patty specialists. That is deliberate. It is the band where app orders grew fastest last year and where no single chain has taken the category.',
   'What it does not do is threaten McDonald\'s or Burger King directly. Those chains sell footfall and family occasions as much as food. The pressure lands on the mid-market: the 20-to-60-outlet regional chains that took delivery seriously late and now pay commission on orders they used to own.',
   'The open question is supply. A patty programme at this scale needs a cold chain that holds in July, and the company has not said who is making them.')},

 {id:'zepto-store',sec:'retail',kick:'STORE FORMATS',t:'Zepto\'s new store format is a bet on fresh produce',
  dek:'Bigger floor, shorter aisles, and a cold chain built for ten-minute delivery. It only works above 3,000 orders a day.',
  img:I('store'),date:'September 29, 2026',time:'32 min ago',read:'6 min read',au:'ra',lead:1,
  kp:['Floor is roughly 2.5× a standard dark store.','Fresh moves from 4% of the basket to a target of 18%.','Viable only in catchments above 3,000 daily orders.'],
  body:P('The new Zepto format is bigger, colder and slower to build — and that is the idea. Fresh produce keeps a grocery customer coming back weekly rather than monthly, and it is the category quick commerce has been worst at.',
   'Walk one and the difference is obvious. Aisles are shorter, so a picker\'s longest walk drops. A third of the floor is refrigerated, against almost none in a standard dark store. There is a sorting bench, which no dark store has, because produce arrives ungraded and leaves graded.',
   'Company material puts fresh at about 4% of the current basket, with a target near 18%. That is not a nudge. It is a different business, with spoilage risk attached.',
   'Below roughly 3,000 orders a day the refrigeration and the extra staff do not pay for themselves, which is why this is a format for a few hundred locations, not a few thousand.')},

 {id:'salad-42cr',sec:'money',kick:'FUNDING',t:'Salad-based D2C brand raises ₹42 Cr in Series B',
  dek:'Led by an existing investor, at a flat-to-modest step up. The money goes to a second kitchen, not new cities.',
  img:I('salad'),date:'September 29, 2026',time:'2 hr ago',read:'3 min read',au:'sn',
  kp:['₹42 Cr, led by an existing investor.','34 outlets; contribution-positive in Bengaluru only.','Capital earmarked for a kitchen, not a land grab.'],
  body:P('A ₹42 crore Series B into a salad chain sounds like 2021. It is not. The round is led by an existing investor at a flat-to-modest step up, and the money is earmarked for a second central kitchen rather than a rollout.',
   'The chain is at 34 outlets. It says contribution margin is positive in Bengaluru and roughly breakeven in Hyderabad. Delhi is not mentioned, which usually means Delhi is not working yet.',
   'Investors are back on food service, but only where the unit economics are already proven in at least one city. Funding a 60-city rollout off one good store is over.')},

 {id:'dmart-qc',sec:'retail',kick:'QUICK COMMERCE',t:'DMart expands into quick commerce — deliberately slowly',
  dek:'A Pune-only pilot, two-hour slots, no ten-minute promise. Everything about it is designed to protect cost.',
  img:I('aisle'),date:'September 28, 2026',time:'3 hr ago',read:'4 min read',au:'ra',
  kp:['Pune only, two-hour delivery windows.','Picks from existing stores — no dark stores.','Shelf price, no surcharge above ₹999.'],
  body:P('DMart has started a quick-commerce pilot in Pune, and everything about it is designed to be boring. Two-hour slots, not ten minutes. Picking out of existing stores, not new dark stores. Shelf price, no surcharge above a ₹999 basket.',
   'That is a strategy, not timidity. DMart\'s entire advantage is cost, and ten-minute delivery destroys cost. A two-hour window lets one picker batch eight orders and keeps the promise inside what a store already does.',
   'If it works, the pressure on Blinkit and Instamart is not on speed. It is on price, in the weekly stock-up basket where DMart has never been beaten.')},

 {id:'protein-choc',sec:'trends',kick:'CATEGORY WATCH',t:'Why protein chocolates are suddenly everywhere',
  dek:'Nine launches in six months, most of them from companies that made only whey a year ago. The asset is distribution, not the recipe.',
  img:I('choc'),date:'September 28, 2026',time:'5 hr ago',read:'4 min read',au:'km',
  kp:['Nine launches in six months.','Gym and pharmacy distribution is the real moat.','Retail margin is roughly double a standard bar.'],
  body:P('Nine protein chocolate launches in six months is not a trend, it is a queue. And most of them are not chocolate companies.',
   'The reason is distribution. A whey brand already sells into 4,000 gyms and a handful of pharmacy chains. A bar at ₹99 with 10g of protein moves through that pipe without a single new conversation, and the recipe is contract-manufactured.',
   'Margins help. A ₹20 chocolate bar leaves a retailer a few rupees. A ₹99 protein bar leaves several times that, for the same shelf space.',
   'Watch repeat rate at month four. Novelty carries the first three.')},

 {id:'yogabar-500',sec:'founders',kick:'FOUNDER INTERVIEW',t:'"We said no to modern trade for two years"',
  dek:'The Yogabar founder on holding one SKU until it earned the range, and why 500 stores was the output rather than the goal.',
  img:I('founder2'),date:'September 28, 2026',time:'6 hr ago',read:'9 min read',au:'km',
  kp:['Refused large-format retail for two years.','Held one SKU until repeat purchase cleared a bar.','Roughly 500 stores today.'],
  body:P('"We said no to every large-format retailer for two years," she says, which at the time read as either discipline or arrogance. It was discipline.',
   'The argument: a shelf in modern trade costs listing fees, slotting and a returns liability, and it teaches you nothing about whether people want the product. One SKU in 40 independent stores teaches you everything, for a fraction of the cost.',
   'They held that SKU until repeat purchase cleared an internal bar. Only then did the range widen, and only then did the big chains get a yes.',
   'Five hundred stores later, the sequencing is the lesson, not the number.')},

 {id:'fssai-labels',sec:'policy',kick:'REGULATION',t:'FSSAI tightens front-of-pack labelling rules',

 {id:'packaged-100bn',sec:'money',kick:'THE NUMBERS',t:'India\'s packaged food market to hit $100 Bn by 2030',

/* ============================ ROUTER ============================ */
function go(spec){
  const [v,arg]=String(spec).split(':');
  S.route={v,arg};
  render();
  const m=document.body.classList.contains('m');
  if(m)$('#phScroll').scrollTop=0; else window.scrollTo(0,0);
}
function render(){
  const {v,arg}=S.route;
  const html=v==='section'?V.section(arg):v==='story'?V.story(arg):v==='author'?V.author(arg)
    :v==='search'?V.search(decodeURIComponent(arg||'')):(V[v]||V.home)();
  $('#app').innerHTML=html;
  const active=v==='section'?arg:v;
  $$('#nav button, #phRail button').forEach(b=>b.classList.toggle('on',b.dataset.go===('section:'+active)||b.dataset.go===active));
  $$('#phNav button').forEach(b=>b.classList.toggle('on',b.dataset.go===v||(v==='home'&&b.dataset.go==='home')));
  $('#signBtn').textContent=S.member?'My account':'Sign In';
  $$('#mobNav button').forEach(b=>b.classList.toggle('on',
    b.dataset.go===v || b.dataset.go==='section:'+arg || (v==='home'&&b.dataset.go==='home')));
  wire();
}
const navHTML=NAV.map(n=>`<button data-go="${['shorts','podcasts'].includes(n.id)?n.id:'section:'+n.id}">${n.name}${n.free?'<span class="free">FREE</span>':''}</button>`).join('');
$('#nav').innerHTML=navHTML;
$('#phRail').innerHTML=navHTML;

/* clicks */
document.addEventListener('click',e=>{
  const sv=e.target.closest('[data-save]');
  if(sv){e.stopPropagation();const id=sv.dataset.save;S.saved.has(id)?S.saved.delete(id):S.saved.add(id);render();return}
  const st=e.target.closest('[data-story]'); if(st){go('story:'+st.dataset.story);return}
  const pd=e.target.closest('[data-pod]');
  if(pd){const p=PODS.find(x=>x.id===pd.dataset.pod);
    openModal(S.member?`<h3>${esc(p.t)}</h3><p class="s">${p.day} · ${p.len}</p>${playerBlock(p)}
      <button class="primary" style="margin-top:16px" data-close>Close</button>`
    :`<span class="lock">🔒 Member exclusive</span><h3 style="margin-top:12px">${esc(p.t)}</h3>
      <p class="s">${p.day} · ${p.len} · chapter 1 is free</p>${playerBlock(p)}
      <button class="primary" style="margin-top:16px" data-go="subscribe">See membership</button>`);
    wire(); return}
  const g=e.target.closest('[data-go]'); if(g){closeModal();go(g.dataset.go);return}
  if(e.target.closest('[data-close]')||e.target.classList.contains('ov'))closeModal();
  if(e.target.id==='wallSignin'||e.target.id==='signBtn'){S.member?openAccount():openSignIn();}
  if(e.target.id==='joinBtn'){setMember(true);openModal(`<h3>You're a member</h3>
    <p class="s">This is a prototype, so nothing was charged.</p>
    <p style="font-size:14.5px;color:var(--ink-2)">Every story is now unlocked. Flip the switch in the grey bar to see the signed-out view again.</p>
    <button class="primary" style="margin-top:14px" data-go="home">Read everything</button>`)}
});

/* modals */
const ovEl=()=>document.body.classList.contains('m')?$('#ovM'):$('#ov');
function openModal(html){const o=ovEl();o.innerHTML=`<div class="modal">${html}</div>`;o.classList.add('on')}
function closeModal(){$$('.ov').forEach(o=>o.classList.remove('on'))}
function openSignIn(){
  openModal(`<h3>Sign in</h3><p class="s">Members get every story, the brief and the live files.</p>
    <input type="email" placeholder="Email" id="siEmail"><input type="password" placeholder="Password">
    <button class="primary" id="siGo">Sign in</button>
    <p style="text-align:center;margin:14px 0 0;font-size:13.5px;color:var(--ink-3)">
      No account? <button style="color:var(--red);font-weight:700" data-go="subscribe">See membership</button></p>`);
  setTimeout(()=>{const b=$('#siGo');if(b)b.onclick=()=>{setMember(true);closeModal();render()}},20);
}
function openAccount(){
  openModal(`<h3>Your membership</h3><p class="s">Member · ₹499/month · renews 29 Oct 2026</p>
    <div style="border:1px solid var(--line);padding:16px;font-size:14px;color:var(--ink-2)">
      <b style="color:var(--ink)">What's included</b><br>Every story · the daily brief · live files · full archive</div>
    <button class="primary" style="margin-top:14px" id="soGo">Sign out</button>`);
  setTimeout(()=>{const b=$('#soGo');if(b)b.onclick=()=>{setMember(false);closeModal();render()}},20);
}
function openSearch(){
  openModal(`<h3>Search Snackfax</h3><p class="s">Headlines, sections and reporters.</p>
    <form id="sf"><input id="si" placeholder="quick commerce, AI, protein, DMart…" autofocus></form>
    <div class="sug">${['quick commerce','AI','protein','matcha','private label'].map(q=>
      `<button data-go="search:${encodeURIComponent(q)}">${q}</button>`).join('')}</div>`);
  setTimeout(()=>{const f=$('#sf');if(f)f.onsubmit=ev=>{ev.preventDefault();closeModal();go('search:'+encodeURIComponent($('#si').value||''))};$('#si')?.focus()},20);
}
$('#searchBtn').onclick=openSearch; $('#searchBtnM').onclick=openSearch;

function setMember(v){
  S.member=v;
  $$('#memSeg button').forEach(b=>b.classList.toggle('on',(b.dataset.mem==='1')===v));
}
$$('#memSeg button').forEach(b=>b.onclick=()=>{setMember(b.dataset.mem==='1');render()});

/* ============================ WIRING ============================ */
function wire(){
  $$('[data-sub]').forEach(f=>f.onsubmit=e=>{e.preventDefault();
    const m=f.parentElement.querySelector('[data-submsg]');
    if(m)m.textContent='Done — the first brief lands tomorrow at 6.30am.';
    f.reset()});
  $$('[data-player]').forEach(initPlayer);
  if($('#liveLog'))drawLog();
}

function initPlayer(root){
  const p=PODS.find(x=>x.id===root.dataset.player)||PODS[0];
  const wave=root.querySelector('[data-wave]'), BARS=54;
  wave.innerHTML=Array.from({length:BARS},()=>`<b style="height:${16+Math.random()*84}%"></b>`).join('');
  let t=0,playing=false,spd=1;
  const cap=S.member?p.secs:(p.chapters[1]?p.chapters[1][1]:p.secs);
  const fmt=s=>`${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,'0')}`;
  const paint=()=>{
    const pr=t/p.secs; $$('b',wave).forEach((b,i)=>b.classList.toggle('p',i/BARS<=pr));
    root.querySelector('[data-tcur]').textContent=fmt(t);
    let idx=0;p.chapters.forEach((c,i)=>{if(t>=c[1])idx=i});
    root.querySelector('[data-chapnow]').textContent=p.chapters[idx][0];
    $$('[data-chaps] button',root).forEach((b,i)=>b.classList.toggle('on',i===idx));
  };
  paint();
  root.querySelector('[data-pp]').onclick=e=>{playing=!playing;e.currentTarget.textContent=playing?'❚❚':'▶'};
  root.querySelector('[data-spd]').onclick=e=>{spd=spd===1?1.5:spd===1.5?2:1;e.currentTarget.textContent=spd.toFixed(1)+'×'};
  $$('[data-chaps] button',root).forEach((b,i)=>b.onclick=()=>{
    if(i>0&&!S.member){go('subscribe');return}
    t=p.chapters[i][1];paint()});
  wave.onclick=e=>{const r=wave.getBoundingClientRect();
    const want=Math.round((e.clientX-r.left)/r.width*p.secs);
    if(want>cap&&!S.member){go('subscribe');return} t=want;paint()};
  setInterval(()=>{if(playing){t=Math.min(p.secs,t+spd);
    if(t>=cap&&!S.member){playing=false;root.querySelector('[data-pp]').textContent='▶';t=cap;paint();
      root.querySelector('[data-chapnow]').textContent='Chapter 1 ends here — members hear the rest';return}
    paint();if(t>=p.secs){playing=false;root.querySelector('[data-pp]').textContent='▶'}}},1000);
}

let liveExtra=0;
function drawLog(){
  const el=$('#liveLog'); if(!el)return;
  el.innerHTML=LIVE.log.map((e,i)=>`<div style="border-left:2px solid ${e[2]?'var(--red)':'var(--line)'};padding:0 0 18px 16px;position:relative">
    <div style="font-size:11px;font-weight:800;letter-spacing:.1em;color:var(--ink-3)">${e[0]}</div>
    <p style="font-family:var(--serif);font-size:16px;margin:4px 0 0">${esc(e[1])}</p></div>`).join('');
}
setInterval(()=>{if(liveExtra<LIVE_NEW.length){LIVE.log.unshift([...LIVE_NEW[liveExtra++],1]);drawLog()}},9000);

/* view toggle */
$$('#viewSeg button').forEach(b=>b.onclick=()=>{
  $$('#viewSeg button').forEach(x=>x.classList.remove('on'));b.classList.add('on');
  const mobile=b.dataset.v==='m';
  document.body.classList.toggle('m',mobile);
  (mobile?$('#phScroll'):$('#appSlot')).appendChild($('#app'));
  window.scrollTo(0,0); render();
});

/* boot */
$('#appSlot').appendChild($('#app'));
function syncViewport(){
  if(innerWidth<=820&&document.body.classList.contains('m')){
    document.body.classList.remove('m');
    $('#appSlot').appendChild($('#app'));
    $$('#viewSeg button').forEach(x=>x.classList.toggle('on',x.dataset.v==='d'));
  }
}
addEventListener('resize',syncViewport); syncViewport();
go('home');
</script>
